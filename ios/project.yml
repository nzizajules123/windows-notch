name: NotchIsland
options:
  bundleIdPrefix: com.windowsnotch
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NotchIsland:
    type: application
    platform: iOS
    sources: [NotchIsland, Shared]
    scheme: {}
    info:
      path: NotchIsland/Info.plist
      properties:
        CFBundleDisplayName: Notch Island
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Clap control listens for claps (clap twice for the privacy screen). Sound is analysed live and never recorded."
        NSAppleMusicUsageDescription: "Shows what's playing in the Music app, with controls and synced lyrics."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.windowsnotch.island
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NotchIslandWidget
  NotchIslandWidget:
    type: app-extension
    platform: iOS
    sources: [NotchIslandWidget, Shared]
    info:
      path: NotchIslandWidget/Info.plist
      properties:
        CFBundleDisplayName: Notch Island
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.windowsnotch.island.widget
